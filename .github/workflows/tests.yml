name: Unit tests

# ---------------------------------------------------------------------------
# Advanced feature (CA1 section 4): fewer, smarter test runs
#
# Problem : the basic "on: push" trigger runs the tests on EVERY push to EVERY
#           branch, even for README edits, and runs them twice for one commit
#           when a pull request is open (once for the push, once for the PR).
# Solution: four changes, each removing a specific kind of wasted run.
#   1. Branch + event filter  -> test at two stages only: when a pull request
#                                is raised/updated, and when code lands on main.
#   2. Path filter            -> run only if code, tests, config or this
#                                workflow changed (docs/README edits are skipped).
#   3. Concurrency group      -> a newer push cancels the older run that is
#                                still in progress for the same branch/PR.
#   4. Draft PR guard         -> unfinished (draft) pull requests are not tested
#                                until marked "ready for review".
# ---------------------------------------------------------------------------

on:
  push:
    branches: [main]
    paths:
      - "**.py"
      - "requirements.txt"
      - "pytest.ini"
      - ".github/workflows/tests.yml"
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "**.py"
      - "requirements.txt"
      - "pytest.ini"
      - ".github/workflows/tests.yml"
  workflow_dispatch:   # manual "Run workflow" button, handy for the demo

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Skip draft pull requests; always run for push / manual runs.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest -v
